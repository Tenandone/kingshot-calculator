name: Review external schedule source changes

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-external-schedules
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reviewed source registry
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check sources without changing published data
        run: node scripts/external/check-sources.mjs --output "$RUNNER_TEMP/ks-schedule-review"
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-source-review-${{ github.run_id }}
          path: ${{ runner.temp }}/ks-schedule-review/source-changes.json
          retention-days: 30
          if-no-files-found: warn
